<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keroppi Valentine 🍀</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #d8f3dc, #95d5b2);
      font-family: 'Poppins', 'Comic Sans MS', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      z-index: 2;
    }

    h1 {
      color: #2d6a4f;
      margin-bottom: 10px;
    }

    p {
      color: #40916c;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      padding: 12px 26px;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #adb5bd;
      color: white;
      position: relative;
    }

    .message {
      margin-top: 25px;
      font-size: 20px;
      color: #1b4332;
      display: none;
    }

    /* Keroppi */
    .keroppi {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      animation: bounce 2s infinite;
    }

    .keroppi.excited {
      animation: excitedJump 0.6s infinite;
    }

    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-18px); }
    }

    @keyframes excitedJump {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      50% { transform: translateX(-50%) translateY(-45px) scale(1.05); }
      100% { transform: translateX(-50%) translateY(0) scale(1); }
    }

    .wave {
      transform-origin: top left;
      animation: waveHand 1.4s infinite ease-in-out;
    }

    @keyframes waveHand {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
      100% { transform: rotate(0deg); }
    }

    .clover {
      position: absolute;
      font-size: 26px;
      animation: floatDown 6s linear infinite;
      pointer-events: none;
    }

    @keyframes floatDown {
      0% { transform: translateY(-10vh) scale(0.8); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(110vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐸 Hi, I'm Cy!</h1>
    <p>Can I be your Valentine? 💖</p>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💕</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <!-- Keroppi SVG -->
  <svg class="keroppi" viewBox="0 0 200 220">
    <!-- body -->
    <circle cx="100" cy="130" r="60" fill="#3cb371" />

    <!-- eyes -->
    <circle cx="60" cy="70" r="30" fill="#3cb371" />
    <circle cx="140" cy="70" r="30" fill="#3cb371" />
    <circle cx="60" cy="70" r="15" fill="white" />
    <circle cx="140" cy="70" r="15" fill="white" />
    <circle cx="60" cy="70" r="7" fill="black" />
    <circle cx="140" cy="70" r="7" fill="black" />

    <!-- mouth -->
    <ellipse cx="100" cy="135" rx="25" ry="15" fill="white" />
    <circle cx="90" cy="135" r="4" fill="black" />
    <circle cx="110" cy="135" r="4" fill="black" />

    <!-- blush -->
    <circle cx="70" cy="130" r="8" fill="#ff8fab" />
    <circle cx="130" cy="130" r="8" fill="#ff8fab" />

    <!-- waving arm -->
    <g class="wave">
      <rect x="150" y="135" width="12" height="45" rx="6" fill="#3cb371" />
    </g>

    <!-- clover heart -->
    <g>
      <circle cx="90" cy="170" r="12" fill="#2ecc71" />
      <circle cx="110" cy="170" r="12" fill="#2ecc71" />
      <circle cx="90" cy="190" r="12" fill="#2ecc71" />
      <circle cx="110" cy="190" r="12" fill="#2ecc71" />
      <rect x="98" y="200" width="4" height="12" rx="2" fill="#1e7f4f" />
    </g>
  </svg>

  <script>
    const message = document.getElementById('message');
    const noBtn = document.getElementById('noBtn');

    function sayYes() {
      message.style.display = 'block';
      message.innerHTML = "See You On February 14 I Love You My Palagi<br><strong>🍀💚🐸</strong>";
      document.querySelector('.keroppi').classList.add('excited');
      spawnClovers(30);
    }

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function spawnClovers(count) {
      for (let i = 0; i < count; i++) {
        const c = document.createElement('div');
        c.className = 'clover';
        c.innerText = '🍀💚🐸';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.animationDuration = 4 + Math.random() * 3 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 7000);
      }
    }
  </script>

</body>
</html>
